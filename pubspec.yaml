name: kampuslink
description: "KampusLink -- study app for Algerian university students: lessons, flashcards, quizzes and module chat, offline, in Arabic, French and English."
publish_to: 'none'
version: 1.0.2+5
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  drift: ^2.34.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6
  firebase_messaging: ^16.5.0
  cached_network_image: ^3.4.1
  go_router: ^17.5.0
  flutter_dotenv: ^6.0.1
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  http: ^1.6.0
  mime: ^2.0.0
  http_parser: ^4.1.2
  image: ^4.9.2
  flutter_blurhash: ^0.9.1
  connectivity_plus: ^7.3.1
  pdfx: ^2.11.0
  file_picker: ^13.1.0
  flutter_riverpod: ^3.4.3
  intl: any
  flutter_localizations:
    sdk: flutter
  firebase_crashlytics: ^5.4.0
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  flutter_math_fork: ^0.7.4
  flutter_svg: ^2.3.0
  package_info_plus: ^10.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/OFL-Cairo.txt
    - assets/fonts/OFL-Noto.txt
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansMath
      fonts:
        - asset: assets/fonts/NotoSansMath-Regular.ttf
    - family: NotoSansSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#3E7BFA"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#3E7BFA"
    theme_color: "#3E7BFA"

flutter_native_splash:
  color: "#0E0F11"
  image: "assets/icon/splash.png"
  android_12:
    image: "assets/icon/splash.png"
    icon_background_color: "#0E0F11"
  web: false



