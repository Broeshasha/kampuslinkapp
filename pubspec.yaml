name: kampuslink
description: "KampusLink -- connecting students in Algeria with translated news, community, and a marketplace."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  drift: ^2.34.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  workmanager: ^0.10.7
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6
  firebase_messaging: ^16.5.0
  cached_network_image: ^3.4.1
  go_router: ^17.5.0
  flutter_dotenv: ^6.0.1
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  http: ^1.6.0
  image: ^4.9.2
  blurhash_dart: ^1.2.1
  flutter_blurhash: ^0.9.1
  share_plus: ^13.3.0
  connectivity_plus: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
flutter:
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#3E7BFA"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#3E7BFA"
    theme_color: "#3E7BFA"

flutter_native_splash:
  color: "#0E0F11"
  image: "assets/icon/splash.png"
  android_12:
    image: "assets/icon/splash.png"
    icon_background_color: "#0E0F11"
  web: false

